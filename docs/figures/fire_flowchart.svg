<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 806' width='100%' style='max-width:1000px;height:auto' role='img' aria-label='De-escalation flowchart for a fire on F19' font-family='Segoe UI, Arial, sans-serif'><title>De-escalation flowchart for a fire on F19</title><defs><marker id='m-ink' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#1d2433'/></marker><marker id='m-evac' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#2e9d57'/></marker><marker id='m-attack' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#d35400'/></marker><marker id='m-lift' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#6a3fb5'/></marker><marker id='m-water' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#1f6fb2'/></marker><marker id='m-smoke' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#7d7d7d'/></marker><marker id='m-ai' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#0b7a75'/></marker><marker id='m-human' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#8e2b8e'/></marker></defs><rect x='0' y='0' width='1000' height='806' fill='#ffffff' rx='8'/><text x='20.0' y='28.0' font-size='15' fill='#1d2433' text-anchor='start' font-weight='bold'>De-escalation flow for a fire on F19: smallest safe response, widened only by written triggers</text><text x='20.0' y='48.0' font-size='11' fill='#5b6474' text-anchor='start' font-weight='normal'>Purple diamonds: a human decides (FSD, then the fire department IC). Teal dashed boxes: AI evidence only; &#x27;not built&#x27; = design scope only.</text><text x='20.0' y='64.0' font-size='11' fill='#b00020' text-anchor='start' font-weight='bold'>The listed fire alarm system runs its own sequence (voice alarm, smoke control, stair unlock) with no AI in the loop.</text><rect x='20.0' y='84.0' width='250.0' height='56.0' rx='6' fill='#f3f5f8' stroke='#1d2433' stroke-width='1.6'/><text x='28.0' y='99.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='bold'>0 PREPARE</text><text x='28.0' y='113.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>plan cards, impairments, drills,</text><text x='28.0' y='127.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>occupant counts kept current</text><rect x='700.0' y='84.0' width='285.0' height='56.0' rx='6' fill='#e8f6f5' stroke='#0b7a75' stroke-width='1.6' stroke-dasharray='6,4'/><text x='708.0' y='99.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='bold'>AI: evidence only</text><text x='708.0' y='113.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>builds this plan card from the building graph;</text><text x='708.0' y='127.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>impairment list; drill tracking: not built</text><line x1='700' y1='112' x2='270' y2='112' stroke='#0b7a75' stroke-width='1' stroke-dasharray='3,3'/><line x1='145.0' y1='140.0' x2='145.0' y2='187.0' stroke='#1d2433' stroke-width='1.6' marker-end='url(#m-ink)'/><rect x='20.0' y='188.0' width='250.0' height='56.0' rx='6' fill='#f3f5f8' stroke='#1d2433' stroke-width='1.6'/><text x='28.0' y='203.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='bold'>1 VERIFY</text><text x='28.0' y='217.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>listed alarm, or an AI early alert</text><text x='28.0' y='231.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>(an AI alert is NOT an alarm)</text><rect x='700.0' y='188.0' width='285.0' height='56.0' rx='6' fill='#e8f6f5' stroke='#0b7a75' stroke-width='1.6' stroke-dasharray='6,4'/><text x='708.0' y='203.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='bold'>AI: evidence only</text><text x='708.0' y='217.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>camera near the device: not built; sensor</text><text x='708.0' y='231.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>label: did not transfer to a new room</text><line x1='700' y1='216' x2='270' y2='216' stroke='#0b7a75' stroke-width='1' stroke-dasharray='3,3'/><line x1='270.0' y1='216.0' x2='354.0' y2='216.0' stroke='#1d2433' stroke-width='1.6' marker-end='url(#m-ink)'/><polygon points='430,184.0 505.0,216 430,248.0 355.0,216' fill='#fbeefb' stroke='#8e2b8e' stroke-width='1.8'/><text x='430.0' y='213.5' font-size='10.5' fill='#1d2433' text-anchor='middle' font-weight='bold'>D1 FSD calls 911</text><text x='430.0' y='226.5' font-size='10.5' fill='#1d2433' text-anchor='middle' font-weight='normal'>AI cannot delay it</text><path d='M430,248 L430,286 L149.0,286' fill='none' stroke='#1d2433' stroke-width='1.6'/><line x1='145.0' y1='286.0' x2='145.0' y2='291.0' stroke='#1d2433' stroke-width='1.6' marker-end='url(#m-ink)'/><rect x='20.0' y='292.0' width='250.0' height='56.0' rx='6' fill='#f3f5f8' stroke='#1d2433' stroke-width='1.6'/><text x='28.0' y='307.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='bold'>2 PROTECT</text><text x='28.0' y='321.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>alert F18-F20; relocate to F14-F16</text><text x='28.0' y='335.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>evacuation stair A (suggested)</text><rect x='700.0' y='292.0' width='285.0' height='56.0' rx='6' fill='#e8f6f5' stroke='#0b7a75' stroke-width='1.6' stroke-dasharray='6,4'/><text x='708.0' y='307.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='bold'>AI: evidence only</text><text x='708.0' y='321.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>drafts plan card; lists people needing help</text><text x='708.0' y='335.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>on alert floors (message template: not built)</text><line x1='700' y1='320' x2='270' y2='320' stroke='#0b7a75' stroke-width='1' stroke-dasharray='3,3'/><line x1='270.0' y1='320.0' x2='354.0' y2='320.0' stroke='#1d2433' stroke-width='1.6' marker-end='url(#m-ink)'/><polygon points='430,288.0 505.0,320 430,352.0 355.0,320' fill='#fbeefb' stroke='#8e2b8e' stroke-width='1.8'/><text x='430.0' y='317.5' font-size='10.5' fill='#1d2433' text-anchor='middle' font-weight='bold'>D2 FSD approves</text><text x='430.0' y='330.5' font-size='10.5' fill='#1d2433' text-anchor='middle' font-weight='normal'>reads one message live</text><path d='M430,352 L430,390 L149.0,390' fill='none' stroke='#1d2433' stroke-width='1.6'/><line x1='145.0' y1='390.0' x2='145.0' y2='395.0' stroke='#1d2433' stroke-width='1.6' marker-end='url(#m-ink)'/><rect x='20.0' y='396.0' width='250.0' height='56.0' rx='6' fill='#f3f5f8' stroke='#1d2433' stroke-width='1.6'/><text x='28.0' y='411.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='bold'>3 HAND OVER</text><text x='28.0' y='425.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>fire department arrives at the</text><text x='28.0' y='439.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>fire command center</text><rect x='700.0' y='396.0' width='285.0' height='56.0' rx='6' fill='#e8f6f5' stroke='#0b7a75' stroke-width='1.6' stroke-dasharray='6,4'/><text x='708.0' y='411.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='bold'>AI: evidence only</text><text x='708.0' y='425.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>briefing: attack stair B, standpipe F18,</text><text x='708.0' y='439.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>elevators, panels, risers, hazards</text><line x1='700' y1='424' x2='270' y2='424' stroke='#0b7a75' stroke-width='1' stroke-dasharray='3,3'/><line x1='270.0' y1='424.0' x2='354.0' y2='424.0' stroke='#1d2433' stroke-width='1.6' marker-end='url(#m-ink)'/><polygon points='430,392.0 505.0,424 430,456.0 355.0,424' fill='#fbeefb' stroke='#8e2b8e' stroke-width='1.8'/><text x='430.0' y='421.5' font-size='10.5' fill='#1d2433' text-anchor='middle' font-weight='bold'>D3 IC takes</text><text x='430.0' y='434.5' font-size='10.5' fill='#1d2433' text-anchor='middle' font-weight='normal'>command</text><path d='M430,456 L430,494 L149.0,494' fill='none' stroke='#1d2433' stroke-width='1.6'/><line x1='145.0' y1='494.0' x2='145.0' y2='499.0' stroke='#1d2433' stroke-width='1.6' marker-end='url(#m-ink)'/><rect x='20.0' y='500.0' width='250.0' height='56.0' rx='6' fill='#f3f5f8' stroke='#1d2433' stroke-width='1.6'/><text x='28.0' y='515.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='bold'>4 CONTAIN</text><text x='28.0' y='529.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>fire department operations</text><text x='28.0' y='543.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>(FSCP, Phase II: fire department only)</text><rect x='700.0' y='500.0' width='285.0' height='56.0' rx='6' fill='#e8f6f5' stroke='#0b7a75' stroke-width='1.6' stroke-dasharray='6,4'/><text x='708.0' y='515.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='bold'>AI: evidence only</text><text x='708.0' y='529.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>alarm spread; where firefighting water goes;</text><text x='708.0' y='543.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>live shaft readings, stair cameras: not built</text><line x1='700' y1='528' x2='270' y2='528' stroke='#0b7a75' stroke-width='1' stroke-dasharray='3,3'/><line x1='270.0' y1='528.0' x2='354.0' y2='528.0' stroke='#1d2433' stroke-width='1.6' marker-end='url(#m-ink)'/><polygon points='430,496.0 505.0,528 430,560.0 355.0,528' fill='#fbeefb' stroke='#8e2b8e' stroke-width='1.8'/><text x='430.0' y='525.5' font-size='10.5' fill='#1d2433' text-anchor='middle' font-weight='bold'>Escalation</text><text x='430.0' y='538.5' font-size='10.5' fill='#1d2433' text-anchor='middle' font-weight='normal'>trigger E1-E6?</text><path d='M430,560 L430,598 L149.0,598' fill='none' stroke='#1d2433' stroke-width='1.6'/><line x1='145.0' y1='598.0' x2='145.0' y2='603.0' stroke='#1d2433' stroke-width='1.6' marker-end='url(#m-ink)'/><rect x='20.0' y='604.0' width='250.0' height='56.0' rx='6' fill='#f3f5f8' stroke='#1d2433' stroke-width='1.6'/><text x='28.0' y='619.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='bold'>5 RECOVER</text><text x='28.0' y='633.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>IC declares knockdown; fire watch</text><text x='28.0' y='647.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>where systems are impaired</text><rect x='700.0' y='604.0' width='285.0' height='56.0' rx='6' fill='#e8f6f5' stroke='#0b7a75' stroke-width='1.6' stroke-dasharray='6,4'/><text x='708.0' y='619.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='bold'>AI: evidence only</text><text x='708.0' y='633.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>salvage list for floors below the fire;</text><text x='708.0' y='647.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>reset checklist: not built</text><line x1='700' y1='632' x2='270' y2='632' stroke='#0b7a75' stroke-width='1' stroke-dasharray='3,3'/><line x1='270.0' y1='632.0' x2='354.0' y2='632.0' stroke='#1d2433' stroke-width='1.6' marker-end='url(#m-ink)'/><polygon points='430,600.0 505.0,632 430,664.0 355.0,632' fill='#fbeefb' stroke='#8e2b8e' stroke-width='1.8'/><text x='430.0' y='629.5' font-size='10.5' fill='#1d2433' text-anchor='middle' font-weight='bold'>D5 IC authorizes</text><text x='430.0' y='642.5' font-size='10.5' fill='#1d2433' text-anchor='middle' font-weight='normal'>resets, re-occupancy</text><path d='M430,664 L430,702 L149.0,702' fill='none' stroke='#1d2433' stroke-width='1.6'/><line x1='145.0' y1='702.0' x2='145.0' y2='707.0' stroke='#1d2433' stroke-width='1.6' marker-end='url(#m-ink)'/><rect x='20.0' y='708.0' width='250.0' height='56.0' rx='6' fill='#f3f5f8' stroke='#1d2433' stroke-width='1.6'/><text x='28.0' y='723.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='bold'>6 LEARN</text><text x='28.0' y='737.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>after-action review with LAFD</text><text x='28.0' y='751.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'></text><rect x='700.0' y='708.0' width='285.0' height='56.0' rx='6' fill='#e8f6f5' stroke='#0b7a75' stroke-width='1.6' stroke-dasharray='6,4'/><text x='708.0' y='723.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='bold'>AI: evidence only</text><text x='708.0' y='737.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>timeline: not built; plan card updates</text><text x='708.0' y='751.0' font-size='11' fill='#1d2433' text-anchor='start' font-weight='normal'>by rerunning the planner</text><line x1='700' y1='736' x2='270' y2='736' stroke='#0b7a75' stroke-width='1' stroke-dasharray='3,3'/><polygon points='430,496.0 505.0,528 430,560.0 355.0,528' fill='#fbeefb' stroke='#8e2b8e' stroke-width='1.8'/><text x='430.0' y='525.5' font-size='10.5' fill='#1d2433' text-anchor='middle' font-weight='bold'>Escalation</text><text x='430.0' y='538.5' font-size='10.5' fill='#1d2433' text-anchor='middle' font-weight='normal'>trigger E1-E6?</text><line x1='505.0' y1='528.0' x2='526.0' y2='528.0' stroke='#8e2b8e' stroke-width='1.6' marker-end='url(#m-human)'/><polygon points='602,499.0 677.0,528 602,557.0 527.0,528' fill='#fbeefb' stroke='#8e2b8e' stroke-width='1.8'/><text x='602.0' y='525.5' font-size='10.5' fill='#1d2433' text-anchor='middle' font-weight='bold'>D4 IC widens zone</text><text x='602.0' y='538.5' font-size='10.5' fill='#1d2433' text-anchor='middle' font-weight='normal'>or total evacuation</text><path d='M602,499 L602,482 L60,482 L60,497' fill='none' stroke='#8e2b8e' stroke-width='1.6' marker-end='url(#m-human)'/><text x='532.0' y='478.0' font-size='10' fill='#8e2b8e' text-anchor='start' font-weight='normal'>back to 4 with the wider zone</text><text x='508.0' y='522.0' font-size='10' fill='#8e2b8e' text-anchor='start' font-weight='normal'>yes</text><text x='436.0' y='574.0' font-size='10' fill='#5b6474' text-anchor='start' font-weight='normal'>no / knockdown</text><text x='24.0' y='260.0' font-size='10' fill='#8e2b8e' text-anchor='start' font-weight='normal' font-style='italic'>AI early alert only: D0 FSD checks by camera; staff by stair, never by elevator</text><text x='20.0' y='792.0' font-size='10' fill='#5b6474' text-anchor='start' font-weight='normal'>Sources: LAFD high-rise sequence policy; LA Ord. 180,648; NFPA high-rise EAP guide; IBC 909.16 (FSCP priority); Sacramento Regional high-rise guideline; First Interstate 1988 (LAFD archive).</text></svg>