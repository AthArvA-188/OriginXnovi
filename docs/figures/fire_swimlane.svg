<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1030 808' width='100%' style='max-width:1030px;height:auto' role='img' aria-label='Swimlane timeline for a fire on F19' font-family='Segoe UI, Arial, sans-serif'><title>Swimlane timeline for a fire on F19</title><defs><marker id='m-ink' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#1d2433'/></marker><marker id='m-evac' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#2e9d57'/></marker><marker id='m-attack' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#d35400'/></marker><marker id='m-lift' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#6a3fb5'/></marker><marker id='m-water' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#1f6fb2'/></marker><marker id='m-smoke' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#7d7d7d'/></marker><marker id='m-ai' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#0b7a75'/></marker><marker id='m-human' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto' markerUnits='userSpaceOnUse'><path d='M0,0 L9,4.5 L0,9 z' fill='#8e2b8e'/></marker></defs><rect x='0' y='0' width='1030' height='808' fill='#ffffff' rx='8'/><text x='16.0' y='26.0' font-size='15' fill='#1d2433' text-anchor='start' font-weight='bold'>Who does what, in order (fire on F19); no clock times are claimed</text><text x='16.0' y='46.0' font-size='11' fill='#b00020' text-anchor='start' font-weight='bold'>The AI lane only reads and shows evidence. Every arrow into the fire alarm system comes from the fire department.</text><rect x='110' y='68' width='174' height='684' fill='#f3f5f8' rx='6'/><text x='197.0' y='86.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='bold'>Fire alarm system (listed)</text><rect x='290' y='68' width='174' height='684' fill='#e8f6f5' rx='6'/><text x='377.0' y='86.0' font-size='13' fill='#0b7a75' text-anchor='middle' font-weight='bold'>Cerebro AI (read-only)</text><text x='377.0' y='99.0' font-size='10' fill='#0b7a75' text-anchor='middle' font-weight='normal' font-style='italic'>evidence only</text><rect x='470' y='68' width='174' height='684' fill='#f7f0f7' rx='6'/><text x='557.0' y='86.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='bold'>FSD at the FCC</text><rect x='650' y='68' width='174' height='684' fill='#f3f5f8' rx='6'/><text x='737.0' y='86.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='bold'>Wardens and occupants</text><rect x='830' y='68' width='174' height='684' fill='#f7f0f7' rx='6'/><text x='917.0' y='86.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='bold'>Fire department IC</text><line x1='12' y1='104' x2='1018' y2='104' stroke='#9aa3b2' stroke-width='0.8' stroke-dasharray='4,3'/><text x='14.0' y='118.0' font-size='12.5' fill='#8e2b8e' text-anchor='start' font-weight='bold'>1 Verify</text><circle cx='200.0' cy='126' r='4' fill='#1d2433'/><line x1='200.0' y1='126.0' x2='732.0' y2='126.0' stroke='#1d2433' stroke-width='2' marker-end='url(#m-ink)'/><text x='470.0' y='119.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='normal'>1. voice alarm on F18-F20</text><path d='M120,168 C170,154 170,186 126,176' fill='none' stroke='#1d2433' stroke-width='2' marker-end='url(#m-ink)'/><text x='172.0' y='165.0' font-size='13' fill='#1d2433' text-anchor='start' font-weight='normal'>2. listed sequence: smoke control, stair pressurization, doors; recall only if lobby/hoistway detector</text><circle cx='200.0' cy='218' r='4' fill='#1d2433'/><line x1='200.0' y1='218.0' x2='372.0' y2='218.0' stroke='#1d2433' stroke-width='2' marker-end='url(#m-ink)'/><text x='290.0' y='211.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='normal'>3. device event (read-only feed)</text><circle cx='380.0' cy='264' r='4' fill='#0b7a75'/><line x1='380.0' y1='264.0' x2='552.0' y2='264.0' stroke='#0b7a75' stroke-width='2' marker-end='url(#m-ai)'/><text x='470.0' y='257.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='normal'>4. evidence panel + draft plan card (evidence only)</text><circle cx='560.0' cy='310' r='4' fill='#1d2433'/><line x1='560.0' y1='310.0' x2='912.0' y2='310.0' stroke='#1d2433' stroke-width='2' marker-end='url(#m-ink)'/><text x='740.0' y='303.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='normal'>5. 911 call (D1); never delayed by the AI</text><line x1='12' y1='334' x2='1018' y2='334' stroke='#9aa3b2' stroke-width='0.8' stroke-dasharray='4,3'/><text x='14.0' y='348.0' font-size='12.5' fill='#8e2b8e' text-anchor='start' font-weight='bold'>2 Protect</text><circle cx='560.0' cy='356' r='4' fill='#1d2433'/><line x1='560.0' y1='356.0' x2='732.0' y2='356.0' stroke='#1d2433' stroke-width='2' marker-end='url(#m-ink)'/><text x='650.0' y='349.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='normal'>6. approved live message (D2): Stair A to F14-F16</text><circle cx='380.0' cy='402' r='4' fill='#0b7a75'/><line x1='380.0' y1='402.0' x2='552.0' y2='402.0' stroke='#0b7a75' stroke-width='2' marker-end='url(#m-ai)'/><text x='470.0' y='395.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='normal'>7. 2 person(s) needing help on alert floors (stair cameras: not built)</text><line x1='12' y1='426' x2='1018' y2='426' stroke='#9aa3b2' stroke-width='0.8' stroke-dasharray='4,3'/><text x='14.0' y='440.0' font-size='12.5' fill='#8e2b8e' text-anchor='start' font-weight='bold'>3 Hand over</text><circle cx='920.0' cy='448' r='4' fill='#d35400'/><line x1='920.0' y1='448.0' x2='568.0' y2='448.0' stroke='#d35400' stroke-width='2' marker-end='url(#m-attack)'/><text x='740.0' y='441.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='normal'>8. arrives at the fire command center (time varies)</text><circle cx='560.0' cy='494' r='4' fill='#1d2433'/><line x1='560.0' y1='494.0' x2='912.0' y2='494.0' stroke='#1d2433' stroke-width='2' marker-end='url(#m-ink)'/><text x='740.0' y='487.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='normal'>9. briefing card (AI drafted, FSD checked)</text><circle cx='920.0' cy='540' r='4' fill='#d35400'/><line x1='920.0' y1='540.0' x2='208.0' y2='540.0' stroke='#d35400' stroke-width='2' marker-end='url(#m-attack)'/><text x='560.0' y='533.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='normal'>10. FSCP, Phase II cars, exit F17, standpipe Stair B F18 (FD only, D3)</text><line x1='12' y1='564' x2='1018' y2='564' stroke='#9aa3b2' stroke-width='0.8' stroke-dasharray='4,3'/><text x='14.0' y='578.0' font-size='12.5' fill='#8e2b8e' text-anchor='start' font-weight='bold'>4 Contain</text><circle cx='380.0' cy='586' r='4' fill='#0b7a75'/><line x1='380.0' y1='586.0' x2='912.0' y2='586.0' stroke='#0b7a75' stroke-width='2' marker-end='url(#m-ai)'/><text x='650.0' y='579.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='normal'>11. alarm spread, water migrating below (live shaft readings: not built)</text><circle cx='920.0' cy='632' r='4' fill='#d35400'/><line x1='920.0' y1='632.0' x2='568.0' y2='632.0' stroke='#d35400' stroke-width='2' marker-end='url(#m-attack)'/><text x='740.0' y='625.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='normal'>12. widen zone or total evacuation if a trigger fires (D4)</text><line x1='12' y1='656' x2='1018' y2='656' stroke='#9aa3b2' stroke-width='0.8' stroke-dasharray='4,3'/><text x='14.0' y='670.0' font-size='12.5' fill='#8e2b8e' text-anchor='start' font-weight='bold'>5 Recover</text><circle cx='920.0' cy='678' r='4' fill='#d35400'/><line x1='920.0' y1='678.0' x2='568.0' y2='678.0' stroke='#d35400' stroke-width='2' marker-end='url(#m-attack)'/><text x='740.0' y='671.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='normal'>13. knockdown; authorizes resets and re-occupancy (D5)</text><line x1='12' y1='702' x2='1018' y2='702' stroke='#9aa3b2' stroke-width='0.8' stroke-dasharray='4,3'/><text x='14.0' y='716.0' font-size='12.5' fill='#8e2b8e' text-anchor='start' font-weight='bold'>6 Learn</text><circle cx='380.0' cy='724' r='4' fill='#0b7a75'/><line x1='380.0' y1='724.0' x2='552.0' y2='724.0' stroke='#0b7a75' stroke-width='2' marker-end='url(#m-ai)'/><text x='470.0' y='717.0' font-size='13' fill='#1d2433' text-anchor='middle' font-weight='normal'>14. after-action timeline (not built)</text><text x='16.0' y='792.0' font-size='10' fill='#5b6474' text-anchor='start' font-weight='normal'>Sequence after the ask-5 research (LAFD policy, LA Ord. 180,648, NFPA EAP guide, Sacramento guideline). SYNTHETIC tower.</text></svg>